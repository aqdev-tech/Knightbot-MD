<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knightbot-MD Session Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold">Knightbot-MD Session Manager</h1>
            <button id="logout-button" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Logout</button>
        </div>

        <div class="bg-white shadow-md rounded p-4 mb-4">
            <h2 class="text-xl font-bold mb-2">Add New Session</h2>
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="phone-number" placeholder="Enter Phone Number (e.g., 15551234567)" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <button id="get-pairing-code" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full sm:w-auto">Get Pairing Code</button>
            </div>
            <div id="pairing-code-container" class="mt-4"></div>
        </div>

        <div class="bg-white shadow-md rounded p-4">
            <h2 class="text-xl font-bold mb-2">Connected Sessions</h2>
            <ul id="sessions" class="divide-y divide-gray-200"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
